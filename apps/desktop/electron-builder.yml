appId: com.vitalyvlasov.impellerreliability
productName: Impeller Reliability
copyright: Copyright © 2026 Власов Виталий Андреевич
artifactName: ImpellerReliabilityCalc-${version}-Setup-${arch}.${ext}
directories:
  output: dist
  buildResources: resources
asar: true
files:
  - out/**
  - package.json
publish: null
afterPack: ./scripts/after-pack-worker-integrity.mjs
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: ImpellerReliabilityCalc
  requestedExecutionLevel: asInvoker
  signExecutable: false
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  differentialPackage: false
  useZip: true
  packElevateHelper: false
  include: resources/installer.nsh
extraResources:
  - from: ../../tools/python-worker/dist/impeller-reliability-worker
    to: python-worker
  - from: resources/licenses
    to: licenses
  - from: resources/reference-data
    to: reference-data
