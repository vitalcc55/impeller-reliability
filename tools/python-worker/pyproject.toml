[project]
name = "impeller-reliability-worker"
version = "0.1.0"
description = "Локальный Python worker Impeller Reliability"
requires-python = "==3.14.6"
dependencies = [
  "numpy==2.5.2",
  "pydantic==2.13.4",
  "scipy==1.18.1",
]

[dependency-groups]
dev = [
  "hypothesis==6.165.10",
  "mypy==2.3.1",
  "pyinstaller==6.22.2",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
minversion = "9.1"
strict = true
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=impeller_reliability",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml:../../.tmp/.codex/evidence/python-coverage.xml",
  "--cov-fail-under=85",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
required-version = "==0.16.4"
target-version = "py314"
line-length = 200
src = ["src", "tests"]
force-exclude = true
extend-exclude = [".git", ".venv", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".tmp", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "PYI", "PGH", "ANN"]
extend-select = ["RUF100"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["impeller_reliability"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
extra_checks = true
strict_equality = true
local_partial_types = true
strict_bytes = true
incremental = false
files = ["src/impeller_reliability", "tests"]
mypy_path = "src"
explicit_package_bases = true
follow_imports = "normal"
ignore_missing_imports = false
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
warn_return_any = true
show_error_context = true
show_error_codes = true
warn_unreachable = true
pretty = true
color_output = true
disallow_any_unimported = true
disallow_any_generics = true
disallow_subclassing_any = true
enable_error_code = ["explicit-override", "ignore-without-code", "possibly-undefined", "redundant-expr", "truthy-bool", "unused-awaitable"]

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "Windows"
include = ["src", "tests"]
exclude = [".git", ".venv", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".tmp", "build", "dist", "**/__pycache__", "**/node_modules", "**/.*"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportMissingTypeStubs = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportUnreachable = "error"
reportImplicitOverride = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "error"
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

[tool.coverage.run]
branch = true
source = ["impeller_reliability"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/impeller_reliability"]
